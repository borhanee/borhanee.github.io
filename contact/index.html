<main class="contact-page">
<section class="contact-section">
<div class="container">
<div class="page-header fade-up">
<h1>
    Get In <span>Touch</span>
</h1>
</div>
<div class="contact-layout">
<div class="contact-info fade-up">
<div class="info-card">
    <div class="info-icon">
        <i data-lucide="mail"></i>
    </div>
    <div>
        <h3>Email Me</h3>
        <p>borhaan@yandex.com</p>
    </div>
</div>
<div class="info-card">
<div class="info-icon">
<i data-lucide="map-pin"></i>
</div>
<div>
<h3>Location</h3>
<p>
    Chittagong, Bangladesh
</p>
</div>
</div>
</div>
<div class="contact-form fade-up">
<form action="https://api.web3forms.com/submit"
      method="POST">
<input
type="hidden"
name="access_key"
value="04d0cd34-316d-4d04-9fa9-293c4667c22d">
      <input
type="hidden"
name="from_name"
value="Borhan Portfolio">
      <input
type="checkbox"
name="botcheck"
style="display:none">
       <div class="form-row">
    <div class="form-group">
        <label for="name">
            Your Name
        </label>
        <input
    type="text"
    id="name"
    name="name"
    placeholder="Your Name"
    required>
    </div>
    <div class="form-group">
        <label for="email">
            Your Email
        </label>
        <input
    type="email"
    id="email"
    name="email"
    placeholder="Your Email"
    required>
    </div>
</div>
<div class="form-group">
    <label for="subject">
        Subject
    </label>
    <input
    type="text"
    id="subject"
    name="subject"
    placeholder="Subject"
    required>
</div>
<div class="form-group">
    <label for="message">
        Message
    </label>
    <textarea
    id="message"
    name="message"
    rows="7"
    placeholder="Your Message"
    required></textarea>
</div>
      <div class="h-captcha" data-captcha="true"></div>
<button
type="submit"
class="btn btn-primary contact-submit">
<svg
class="send-icon"
viewBox="0 0 24 24"
aria-hidden="true">
<path
d="M22 2L11 13"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"/>
<path
d="M22 2L15 22L11 13L2 9L22 2Z"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"/>
</svg>
<span>
Send Message
</span>
</button>
</form>
</div>
</div>
</section>
